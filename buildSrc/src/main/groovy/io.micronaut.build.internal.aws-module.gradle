plugins {
    id "io.micronaut.build.internal.aws-base"
    id "io.micronaut.build.internal.module"
}
ossIndexAudit {
    excludeCompileOnly = true
}
configurations.all {
    resolutionStrategy {
        force("commons-io:commons-io:2.14.0")
        // first version patched https://ossindex.sonatype.org/component/pkg:maven/commons-io/commons-io
    }
}
dependencies {
    testRuntimeOnly(mnTest.junit.platform.launcher)
}
micronautBuild {
    descriptor {
        parentModuleId = "io.micronaut.aws:micronaut-aws-common"
    }
}
//TODO remove once Micronaut Test ships Spock version compatible with Groovy 5
configurations.all {
    resolutionStrategy {
        force("org.spockframework:spock-core:2.4-groovy-5.0")
    }
}

